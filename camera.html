<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Scan — TerraPulse 🌱</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="camera">

  <!-- Header Banner (Ref Image 4) -->
  <header class="app-header-banner">
    <a href="dashboard.html" class="brand-wrapper">
      <img src="assets/logo.png" alt="TerraPulse Logo" class="brand-logo-img">
      <span class="brand-name-text">TERRAPULSE</span>
    </a>
    <ul class="app-nav-links">
      <li><a href="dashboard.html" class="app-nav-link" data-page="dashboard">HOME</a></li>
      <li><a href="camera.html" class="app-nav-link active" data-page="camera">CAMERA</a></li>
      <li><a href="history.html" class="app-nav-link" data-page="history">HISTORY</a></li>
    </ul>
    <div class="user-avatar-circle" title="Profile Avatar">M</div>
  </header>

  <!-- Main Viewport matching Reference Image 4 -->
  <main class="camera-page-viewport">
    <h1 class="camera-page-title">CAMERA</h1>

    <!-- Light Green Main Container Card (Ref Image 4) -->
    <div class="camera-main-card">
      
      <!-- White Preview Image Box (Ref Image 4) -->
      <div id="camera-preview-box" class="camera-preview-box" title="Tap to capture photo or select leaf image file">
        <video id="camera-video" autoplay playsinline muted></video>
        <img id="camera-preview-img" style="display: none;" alt="Captured Leaf Image">
        <div id="preview-placeholder" class="camera-preview-placeholder">IMG</div>
      </div>

      <!-- File Input Fallback -->
      <input type="file" id="camera-file-input" accept="image/jpeg,image/jpg,image/png,image/webp" style="display: none;">

      <!-- Action Button -->
      <button id="btn-analyze-camera" class="btn btn-primary btn-lg" style="display: none; background-color: #004d1a; border-radius: 9999px; padding: 0.85rem 3rem;">
        🧪 Analyze Plant Leaf
      </button>

      <!-- Processing Pipeline Status Text -->
      <div id="scan-status-text" class="scan-status-indicator" style="display: none;">
        Ready to scan leaf
      </div>

      <!-- Disease Analysis Result Area (Ref Image 4) -->
      <div id="camera-disease-result" class="disease-result-container" style="display: none;">
        
        <!-- Disease Name -->
        <div class="result-item-block">
          <div class="result-label">Disease</div>
          <div id="res-disease" class="result-content" style="font-size: 1.4rem; color: #000000;">Leaf Spot</div>
        </div>

        <!-- Problem Explanation -->
        <div class="result-item-block" style="text-align: center;">
          <div class="result-label">Problem</div>
          <div id="res-problem" class="result-content" style="color: #6b7280; max-width: 500px; margin: 0 auto;">
            Fungal lesions causing dark circular spots and leaf damage.
          </div>
        </div>

        <!-- Recommended Solution -->
        <div class="result-item-block" style="text-align: center;">
          <div class="result-label" style="color: #004d1a;">Solution</div>
          <div id="res-solution" class="result-content" style="color: #111827; max-width: 500px; margin: 0 auto;">
            Remove infected leaves and apply organic copper-based fungicide spray.
          </div>
        </div>

      </div>

    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

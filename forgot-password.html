<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TerraPulse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="forgot-password">

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html">
          <img src="assets/logo.png" alt="TerraPulse Logo" class="auth-logo">
        </a>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email to receive a password reset link</p>
      </div>

      <form id="forgot-password-form" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="farmer@terrapulse.agri" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Send Reset Link
        </button>

        <div class="auth-footer-links" style="justify-content: center; margin-top: 1.5rem;">
          <a href="login.html" class="auth-link">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

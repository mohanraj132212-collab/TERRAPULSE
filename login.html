<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TerraPulse 🌱</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

  <!-- Header Banner -->
  <header class="app-header-banner">
    <a href="index.html" class="brand-wrapper">
      <img src="assets/logo.png" alt="TerraPulse Logo" class="brand-logo-img">
      <span class="brand-name-text">TERRAPULSE</span>
    </a>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Sign in to your TerraPulse account</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="farmer@terrapulse.agri" value="farmer@terrapulse.agri" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" value="password123" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Login
        </button>

        <div class="auth-footer-links" style="justify-content: center; gap: 0.5rem; margin-top: 1.5rem;">
          <span>Don't have an account?</span>
          <a href="register.html" class="auth-link">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

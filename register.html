<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TerraPulse 🌱</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">

  <!-- Header Banner -->
  <header class="app-header-banner">
    <a href="index.html" class="brand-wrapper">
      <img src="assets/logo.png" alt="TerraPulse Logo" class="brand-logo-img">
      <span class="brand-name-text">TERRAPULSE</span>
    </a>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Verify your email address via OTP to register</p>
      </div>

      <form id="register-form" class="auth-form" autocomplete="off">
        <!-- STEP 1: Basic Information -->
        <div class="form-group">
          <label for="full-name" class="form-label">Name</label>
          <input type="text" id="full-name" class="form-input" placeholder="Enter your name" required value="">
        </div>

        <div class="form-group">
          <label for="mobile" class="form-label">Mobile Number</label>
          <input type="tel" id="mobile" class="form-input" placeholder="Enter your mobile number" required value="">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required style="flex: 1;" value="">
            <button id="btn-send-otp" type="button" class="btn btn-secondary btn-sm" style="white-space: nowrap;">
              Send OTP
            </button>
          </div>
        </div>

        <!-- STEP 2: OTP Verification Field (Revealed after Send OTP) -->
        <div id="otp-group" class="form-group" style="display: none; background: #f0fdf4; padding: 1rem; border-radius: var(--radius-md); border: 1px solid #bbf7d0;">
          <label for="otp-input" class="form-label" style="color: #166534;">Enter 6-Digit Email OTP</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="otp-input" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6" style="flex: 1; letter-spacing: 0.2em; font-weight: 800;" value="">
            <button id="btn-verify-otp" type="button" class="btn btn-primary btn-sm">
              Verify OTP
            </button>
          </div>
        </div>

        <!-- STEP 3: Password Section (Unlocked ONLY after successful OTP verification) -->
        <div id="password-section" style="display: none;">
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" value="">
          </div>

          <div class="form-group">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password" value="">
          </div>
        </div>

        <button id="btn-create-account" type="submit" class="btn btn-primary btn-lg" disabled style="width: 100%; margin-top: 1rem;">
          Create Account
        </button>

        <div class="auth-footer-links" style="justify-content: center; gap: 0.5rem; margin-top: 1.5rem;">
          <span>Already have an account?</span>
          <a href="login.html" class="auth-link">Login</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

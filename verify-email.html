<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — TerraPulse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="verify-email">

  <div class="auth-page">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-header">
        <a href="index.html">
          <img src="assets/logo.png" alt="TerraPulse Logo" class="auth-logo">
        </a>
        <div style="font-size: 3rem; margin: 0.5rem 0;">📩</div>
        <h1 class="auth-title">Verify Your Email</h1>
        <p class="auth-subtitle">We sent a verification link to <strong id="user-email-display">your email</strong></p>
      </div>

      <p style="font-size: 0.9rem; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 2rem;">
        Please check your inbox and click the verification link to activate your TerraPulse account.
      </p>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button id="btn-activate-account" class="btn btn-primary btn-lg">
          Simulate Email Activation
        </button>
        <button id="btn-resend-verification" class="btn btn-secondary">
          Resend Verification Email
        </button>
      </div>

      <div style="margin-top: 2rem; font-size: 0.85rem;">
        <a href="login.html" class="auth-link">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
